<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>沙场点兵 · 桌面军棋</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%235a1d14'/><text x='32' y='46' font-size='40' text-anchor='middle' fill='%23e9c46a' font-family='serif'>旗</text></svg>" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="winbar" aria-label="胜率">
      <span class="side red" id="win-red">红 50%</span>
      <div class="bar"><div class="fill" id="win-fill"></div><div class="mid"></div></div>
      <span class="side black" id="win-black">黑 50%</span>
    </div>

    <section class="panel left" id="controls">
      <header>
        <h1>沙场点兵</h1>
        <span id="selftest" class="badge ok" title="规则引擎自检">自检 ✓</span>
        <button id="btn-fold" class="fold" title="收起/展开设置">收起</button>
      </header>
      <div class="row seed">
        <span>种子</span><code id="seed">------</code>
        <button id="btn-new">新种子</button>
        <button id="btn-replay">重放该种子</button>
      </div>
      <div class="row">
        <button id="btn-pause" class="primary">暂停</button>
        <label class="check"><input type="checkbox" id="auto-next" checked />打完自动开新局</label>
      </div>
      <div class="more">
      <label class="slider">速度 <input type="range" id="speed" min="0.25" max="3" step="0.05" value="1" /><output id="speed-out">1.0×</output></label>
      <label class="slider">温度 <input type="range" id="temp" min="0" max="1" step="0.01" value="0.35" /><output id="temp-out">0.35</output></label>
      <div class="row">
        <label>推演深度
          <select id="depth"><option value="2" selected>2</option><option value="3">3</option><option value="4">4（更慢）</option></select>
        </label>
        <label>镜头
          <select id="camera"><option value="auto" selected>自动导播</option><option value="free">自由视角</option><option value="top">俯视</option><option value="seat">入座（己方身后）</option></select>
        </label>
      </div>
      <div class="row">
        <label>规则
          <select id="mode"><option value="dark" selected>暗棋</option><option value="open">明棋</option></select>
        </label>
        <label>视角
          <select id="view"><option value="all" selected>全知观战</option><option value="r">红方（看不见黑方兵种）</option><option value="b">黑方（看不见红方兵种）</option></select>
        </label>
      </div>
      <div class="row">
        <label>红方 <select id="ctl-r"><option value="ai" selected>电脑</option><option value="human">我来下</option></select></label>
        <label>黑方 <select id="ctl-b"><option value="ai" selected>电脑</option><option value="human">我来下</option></select></label>
      </div>
      <p class="hint">暗棋里双方电脑都看不见对方的兵种，只能靠交战结果推理。你接管一方时，视角会切到那一方：没认出的敌子蒙着布。轮到你时，点己方棋子再点目标点。右键拖动或滚轮切到自由视角，空格暂停。</p>
      </div>
    </section>

    <section class="panel right" id="record">
      <div class="armies">
        <div class="army red"><b>红方</b><span id="army-r">—</span></div>
        <div class="army black"><b>黑方</b><span id="army-b">—</span></div>
      </div>
      <div class="roster" aria-label="兵力">
        <div class="line red" id="roster-r"></div>
        <div class="line black" id="roster-b"></div>
      </div>
      <div id="status" class="status">准备开局</div>
      <ol id="moves" class="moves"></ol>
    </section>

    <div id="comment" class="comment"><span id="comment-text">桌上的两支军队已经列好阵</span><small id="comment-sub"></small></div>
    <div id="banner" class="banner hidden"><div class="title" id="banner-title"></div><div class="sub" id="banner-sub"></div></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
